<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    ISLE OF SKRAP - LEVEL 0: FLOATSHEIM (SEA LEVEL)
    Scale: 64x64 Tiles (1 Tile = 16px at 1024px resolution)
  -->

  <!-- 1. Background (Blueprint Blue) -->
  <rect x="0" y="0" width="1024" height="1024" fill="#001a33" />

  <!-- 2. Grid System (16px spacing = 1 Tile) -->
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="url(#grid)" />
      <path d="M 128 0 L 0 0 0 128" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid-major)" />

  <!-- 3. Coordinate Labels -->
  <text x="10" y="20" font-family="Consolas, monospace" fill="#4dabf7" font-size="14">X:00</text>
  <text x="1010" y="20" font-family="Consolas, monospace" fill="#4dabf7" font-size="14" text-anchor="end">X:64</text>
  <text x="10" y="1010" font-family="Consolas, monospace" fill="#4dabf7" font-size="14">Y:64</text>

  <!-- 4. The Island Footprint (Irregular Trash Shape) -->
  <!-- Center is roughly 32,32 (512, 512) -->
  <path d="
    M 300 200 
    Q 512 100 700 250 
    L 850 400 
    Q 900 600 750 800 
    L 512 900 
    Q 200 850 150 600 
    L 200 400 
    Z" 
    fill="#0d2b45" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

  <!-- 5. Zoning Areas -->
  
  <!-- ZONE A: THE HEAP (Bank Area) - Center -->
  <g transform="translate(400, 400)">
    <rect x="0" y="0" width="224" height="224" fill="rgba(255,215,0,0.1)" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="112" y="112" font-family="Consolas, monospace" fill="#ffd700" font-size="20" text-anchor="middle">THE HOARD (BANK)</text>
    <text x="112" y="140" font-family="Consolas, monospace" fill="#ffd700" font-size="12" text-anchor="middle">Z:0 -> Z:1</text>
  </g>

  <!-- ZONE B: THE VENT ENTRANCE - Dead Center -->
  <circle cx="512" cy="512" r="48" fill="#330000" stroke="#ff4444" stroke-width="3" />
  <text x="512" y="517" font-family="Consolas, monospace" fill="#ff4444" font-size="14" text-anchor="middle" font-weight="bold">VENT SHAFT</text>
  <text x="512" y="535" font-family="Consolas, monospace" fill="#ff4444" font-size="10" text-anchor="middle">(Down to Z:-1)</text>

  <!-- ZONE C: DOCKS - South -->
  <rect x="448" y="850" width="128" height="150" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2"/>
  <text x="512" y="900" font-family="Consolas, monospace" fill="white" font-size="16" text-anchor="middle">ARRIVALS DOCK</text>
  
  <!-- ZONE D: SCAVENGER HUTS - West Rim -->
  <rect x="200" y="400" width="100" height="80" fill="none" stroke="#aaffaa" stroke-width="2"/>
  <text x="250" y="445" font-family="Consolas, monospace" fill="#aaffaa" font-size="12" text-anchor="middle">HUTS</text>
  <rect x="220" y="500" width="80" height="80" fill="none" stroke="#aaffaa" stroke-width="2"/>

  <!-- ZONE E: RAMP UP - East -->
  <path d="M 700 400 L 800 400 L 800 600 L 700 600" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="750" y="500" font-family="Consolas, monospace" fill="#00ffff" font-size="14" text-anchor="middle" transform="rotate(-90 750 500)">RAMP TO JETTSTROM (Z+1)</text>

  <!-- 6. Icons/Key -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="200" height="120" fill="#00091a" stroke="white" stroke-width="2"/>
    <text x="20" y="30" font-family="Consolas, monospace" fill="white" font-size="16" font-weight="bold">ISLE OF SKRAP</text>
    <text x="20" y="50" font-family="Consolas, monospace" fill="#4dabf7" font-size="12">LEVEL: 0 (Ground)</text>
    <text x="20" y="70" font-family="Consolas, monospace" fill="white" font-size="12">GRID: 64x64 (1=1m)</text>
    <line x1="20" y1="85" x2="180" y2="85" stroke="white" stroke-width="1"/>
    <text x="20" y="105" font-family="Consolas, monospace" fill="#ffd700" font-size="12">YELLOW = Bank/Services</text>
  </g>

</svg>

