<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Border -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#212121" stroke-width="10" />

  <!-- Wood Board Background -->
  <rect x="5" y="5" width="502" height="502" fill="#5D4037" />
  <line x1="50" y1="0" x2="50" y2="512" stroke="#3E2723" stroke-width="2" />
  <line x1="150" y1="0" x2="150" y2="512" stroke="#3E2723" stroke-width="2" />
  <line x1="250" y1="0" x2="250" y2="512" stroke="#3E2723" stroke-width="2" />
  <line x1="350" y1="0" x2="350" y2="512" stroke="#3E2723" stroke-width="2" />
  <line x1="450" y1="0" x2="450" y2="512" stroke="#3E2723" stroke-width="2" />

  <!-- Parchment Paper -->
  <rect x="80" y="60" width="352" height="400" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2" rx="2" filter="url(#shadow)" />
  
  <!-- Nail -->
  <circle cx="256" cy="80" r="6" fill="#424242" />

  <!-- Text -->
  <text x="256" y="120" font-family="Times New Roman" font-size="28" text-anchor="middle" fill="#3E2723" font-weight="bold" text-decoration="underline">SALVAGE REQUEST</text>
  
  <text x="100" y="180" font-family="Times New Roman" font-size="18" fill="black">Wanted:</text>
  <text x="120" y="220" font-family="Courier New" font-size="20" fill="#B71C1C" font-weight="bold">- 5x Waterlogged Planks</text>
  <text x="120" y="250" font-family="Courier New" font-size="20" fill="#B71C1C" font-weight="bold">- 2x Rusty Anchors</text>

  <text x="100" y="320" font-family="Times New Roman" font-size="18" fill="black">Reward:</text>
  <text x="120" y="360" font-family="Courier New" font-size="24" fill="#1B5E20" font-weight="bold">50 SCRAP</text>
  <text x="120" y="390" font-family="Courier New" font-size="16" fill="#1B5E20">(+ Construction XP)</text>

  <!-- Stamp -->
  <circle cx="350" cy="400" r="40" fill="none" stroke="#B71C1C" stroke-width="4" opacity="0.6" transform="rotate(-15 350 400)" />
  <text x="350" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#B71C1C" opacity="0.6" transform="rotate(-15 350 400)" font-weight="bold">FLOTSHEIM</text>
  <text x="350" y="420" font-family="Arial" font-size="10" text-anchor="middle" fill="#B71C1C" opacity="0.6" transform="rotate(-15 350 400)">APPROVED</text>

</svg>