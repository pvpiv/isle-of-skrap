<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <defs>
    <!-- OSRS Minimap Water Pattern -->
    <pattern id="water" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#6277CF"/>
      <!-- Subtle wave texture would go here, keeping it flat for now -->
    </pattern>
    <!-- Map Marker Filter (Drop Shadow) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="black" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: OSRS Water Blue -->
  <rect width="100%" height="100%" fill="#6277CF" />

  <!-- Context: Surrounding Ocean Debris (Tiny dots) -->
  <circle cx="100" cy="100" r="5" fill="#5D4037" opacity="0.6"/>
  <circle cx="150" cy="80" r="3" fill="#5D4037" opacity="0.6"/>
  <circle cx="900" cy="900" r="6" fill="#5D4037" opacity="0.6"/>

  <!-- GRID Overlay (Faint, to show tile scale) -->
  <!-- 128x128 grid implies 8px per tile on 1024 canvas -->
  <path d="M 0 0 L 1024 0" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
  
  <!-- ================= FLOTSHEIM (North) ================= -->
  <!-- The Ship Stack (Brown Wood) -->
  <path d="M 200 450 Q 512 100 824 450 L 750 450 Q 512 250 274 450 Z" fill="#5D4037" stroke="#3E2723" stroke-width="4" />
  
  <!-- Upper Decks (Lighter Brown) -->
  <path d="M 250 420 Q 512 200 774 420" fill="none" stroke="#795548" stroke-width="40" stroke-linecap="round"/>
  
  <!-- Bridges (Tan) -->
  <line x1="300" y1="450" x2="300" y2="650" stroke="#8D6E63" stroke-width="12" />
  <line x1="724" y1="450" x2="724" y2="650" stroke="#8D6E63" stroke-width="12" />

  <!-- ================= JETTSTROM (South) ================= -->
  <!-- The Docks (Grey Stone/Metal) -->
  <path d="M 250 650 L 774 650 L 720 800 L 300 800 Z" fill="#757575" stroke="#424242" stroke-width="4" />
  
  <!-- The Crane Area (Yellow hint) -->
  <rect x="700" y="660" width="60" height="60" fill="#616161" stroke="#212121" />
  
  <!-- The Incinerator Grate (Dark Grey) -->
  <rect x="412" y="630" width="200" height="40" fill="#424242" stroke="#212121" />

  <!-- ================= MINIMAP ICONS ================= -->
  
  <!-- Bank Icon ($) - Flotsheim Top -->
  <g transform="translate(512, 300)" filter="url(#shadow)">
    <rect x="-15" y="-15" width="30" height="30" fill="#FFD700" stroke="black" stroke-width="1"/>
    <text x="0" y="8" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="black">$</text>
  </g>

  <!-- Quest Icon (*) - Flotsheim Entry -->
  <g transform="translate(250, 450)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="12" fill="#2962FF" stroke="white" stroke-width="2"/>
    <text x="0" y="6" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="white">*</text>
  </g>

  <!-- Transport Icon (Anchor) - Jettstrom Docks -->
  <g transform="translate(512, 800)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="15" fill="#0277BD" stroke="white" stroke-width="2"/>
    <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="white" stroke-width="2" /> <!-- Fake Anchor shape -->
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">⚓</text>
  </g>

  <!-- Anvil/Furnace Icon (Recycler) - Jettstrom West -->
  <g transform="translate(350, 700)" filter="url(#shadow)">
    <rect x="-12" y="-12" width="24" height="24" fill="#5D4037" stroke="black" stroke-width="1"/>
    <rect x="-8" y="-4" width="16" height="8" fill="orange"/>
  </g>

  <!-- ================= SCALE REFERENCE ================= -->
  <!-- "Typical 7x7 Room" visualization -->
  <g transform="translate(50, 900)">
    <text x="0" y="-10" font-family="Arial" font-size="14" fill="white" font-weight="bold">SCALE REF</text>
    <!-- A 7x7 tile room is approx 56x56 pixels at this scale -->
    <rect x="0" y="0" width="56" height="56" fill="none" stroke="white" stroke-width="2" />
    <text x="28" y="32" font-family="Arial" font-size="10" fill="white" text-anchor="middle">7x7 Tiles</text>
  </g>

  <!-- ================= LABELS (OSRS Map Style) ================= -->
  <text x="512" y="150" font-family="Arial" font-size="24" text-anchor="middle" fill="#FFD700" stroke="black" stroke-width="1" font-weight="bold">Isle of Skrap</text>

</svg>
