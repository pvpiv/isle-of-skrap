<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="steam" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#81D4FA" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#004D66" />
  
  <!-- Currents -->
  <path d="M 100 900 Q 300 700 450 550" fill="none" stroke="#81D4FA" stroke-width="4" stroke-dasharray="15,10" marker-end="url(#arrow)" opacity="0.6"/>
  <path d="M 900 900 Q 700 700 550 550" fill="none" stroke="#81D4FA" stroke-width="4" stroke-dasharray="15,10" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Grid Overlay (Scale: 128x128 tiles) -->
  <!-- Assuming 1024px canvas, 128 tiles = 8px per tile -->
  <rect x="50" y="50" width="924" height="924" fill="url(#grid)" stroke="white" stroke-width="2" />
  
  <!-- Coordinate Numbers (Scale: 0-120) -->
  <text x="50" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">0</text>
  <text x="194" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">20</text>
  <text x="338" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">40</text>
  <text x="482" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">60</text>
  <text x="626" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">80</text>
  <text x="770" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">100</text>
  <text x="914" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">120</text>
  
  <text x="40" y="55" font-family="Arial" font-size="12" fill="white" text-anchor="end">0</text>
  <text x="40" y="199" font-family="Arial" font-size="12" fill="white" text-anchor="end">20</text>
  <text x="40" y="343" font-family="Arial" font-size="12" fill="white" text-anchor="end">40</text>
  <text x="40" y="487" font-family="Arial" font-size="12" fill="white" text-anchor="end">60</text>
  <text x="40" y="631" font-family="Arial" font-size="12" fill="white" text-anchor="end">80</text>
  <text x="40" y="775" font-family="Arial" font-size="12" fill="white" text-anchor="end">100</text>
  <text x="40" y="919" font-family="Arial" font-size="12" fill="white" text-anchor="end">120</text>

  <!-- The Vent (Center) -->
  <circle cx="512" cy="512" r="80" fill="#003344" stroke="#4FC3F7" stroke-width="2" stroke-dasharray="10,10" />
  <text x="512" y="515" font-family="Arial" font-size="16" text-anchor="middle" fill="#E1F5FE" font-weight="bold">THERMAL</text>
  <text x="512" y="535" font-family="Arial" font-size="16" text-anchor="middle" fill="#E1F5FE" font-weight="bold">VENT</text>

  <!-- Flotsheim (North C-Shape) - Larger footprint now -->
  <path d="M 150 450 Q 512 50 874 450 L 750 450 Q 512 250 274 450 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2" />
  <path d="M 250 400 Q 512 200 774 400" fill="none" stroke="#6D4C41" stroke-width="30" stroke-linecap="round"/>
  <text x="512" y="280" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold" stroke="black" stroke-width="0.5">BANK (The Heights)</text>

  <!-- Jettstrom (South Docks) - Expanded -->
  <path d="M 250 650 L 774 650 L 720 850 L 300 850 Z" fill="#757575" stroke="#424242" stroke-width="2" />
  <!-- Crane (East) -->
  <rect x="700" y="660" width="60" height="60" fill="#FFD700" stroke="black" />
  <text x="730" y="740" font-family="Arial" font-size="16" text-anchor="middle" fill="white">CRANE</text>

  <!-- The Bridges (Prominent) -->
  <rect x="300" y="450" width="40" height="200" fill="#8D6E63" stroke="#3E2723" rx="5" />
  <text x="320" y="550" font-family="Arial" font-size="12" text-anchor="middle" fill="white" transform="rotate(-90 320 550)">West Bridge</text>
  
  <rect x="684" y="450" width="40" height="200" fill="#8D6E63" stroke="#3E2723" rx="5" />
  <text x="704" y="550" font-family="Arial" font-size="12" text-anchor="middle" fill="white" transform="rotate(-90 704 550)">East Bridge</text>

  <!-- Labels -->
  <text x="512" y="220" font-family="Arial" font-size="36" text-anchor="middle" fill="white" font-weight="bold" stroke="black" stroke-width="1">FLOTSHEIM</text>
  <text x="512" y="850" font-family="Arial" font-size="36" text-anchor="middle" fill="white" font-weight="bold" stroke="black" stroke-width="1">JETTSTROM</text>

  <!-- Tile Legend -->
  <g transform="translate(850, 850)">
    <rect x="0" y="0" width="120" height="80" fill="rgba(0,0,0,0.5)" stroke="white" />
    <text x="60" y="20" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">LEGEND</text>
    
    <rect x="20" y="35" width="8" height="8" fill="none" stroke="white" stroke-width="1" />
    <text x="35" y="44" font-family="Arial" font-size="12" fill="white">= 1 Tile</text>
    
    <rect x="20" y="55" width="80" height="8" fill="none" stroke="white" stroke-width="1" />
    <text x="60" y="64" font-family="Arial" font-size="10" fill="white" text-anchor="middle">= 10 Tiles</text>
  </g>

</svg>