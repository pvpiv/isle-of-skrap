<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Border Frame -->
  <rect x="0" y="0" width="1024" height="1024" fill="none" stroke="#212121" stroke-width="20" />

  <!-- Background Ocean -->
  <rect x="10" y="10" width="1004" height="1004" fill="#006994" />
  
  <!-- The Vent Zone (North/Top of this view) -->
  <rect x="10" y="10" width="1004" height="200" fill="url(#steamGradient)" />
  <defs>
    <linearGradient id="steamGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#006994;stop-opacity:0" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <text x="512" y="100" font-family="Arial" font-size="30" text-anchor="middle" fill="white" font-weight="bold">THE THERMAL VENT (North)</text>

  <!-- Dock Platform (L-Shape) -->
  <rect x="100" y="400" width="800" height="400" fill="#757575" stroke="#424242" stroke-width="4" />
  <!-- Extension towards the Vent -->
  <rect x="300" y="200" width="400" height="200" fill="#616161" stroke="#424242" stroke-width="4" />
  
  <!-- Wood Planking Pattern overlay -->
  <line x1="100" y1="500" x2="900" y2="500" stroke="#616161" stroke-width="2" />
  <line x1="100" y1="600" x2="900" y2="600" stroke="#616161" stroke-width="2" />
  <line x1="100" y1="700" x2="900" y2="700" stroke="#616161" stroke-width="2" />

  <!-- The Crane (East Side / Right) -->
  <rect x="750" y="450" width="100" height="100" fill="#FDD835" stroke="black" stroke-width="3" />
  <line x1="800" y1="500" x2="500" y2="600" stroke="black" stroke-width="5" /> <!-- Boom Arm -->
  <circle cx="500" cy="600" r="20" fill="none" stroke="black" stroke-width="3" /> <!-- Hook -->
  <text x="800" y="440" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold">CRANE</text>

  <!-- The Recycler (West Side / Left) -->
  <circle cx="250" cy="550" r="80" fill="#424242" stroke="#212121" stroke-width="5" />
  <circle cx="250" cy="550" r="40" fill="#B71C1C" /> <!-- The "Mouth" -->
  <text x="250" y="440" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold">THE RECYCLER</text>

  <!-- The Steam Stream Grate (Center North) -->
  <rect x="400" y="220" width="200" height="100" fill="#263238" stroke="black" stroke-width="5" />
  <line x1="420" y1="220" x2="420" y2="320" stroke="white" stroke-width="2" />
  <line x1="460" y1="220" x2="460" y2="320" stroke="white" stroke-width="2" />
  <line x1="500" y1="220" x2="500" y2="320" stroke="white" stroke-width="2" />
  <line x1="540" y1="220" x2="540" y2="320" stroke="white" stroke-width="2" />
  <line x1="580" y1="220" x2="580" y2="320" stroke="white" stroke-width="2" />
  <text x="500" y="200" font-family="Arial" font-size="20" text-anchor="middle" fill="#81D4FA">The Grate (Incinerator)</text>

  <!-- Trade Ship (Docked South) -->
  <path d="M 150 850 L 450 850 L 400 950 L 200 950 Z" fill="#795548" stroke="black" stroke-width="3" />
  <text x="300" y="920" font-family="Arial" font-size="20" fill="white">Trade Ship</text>

  <!-- Tile Legend -->
  <g transform="translate(850, 900)">
    <rect x="0" y="0" width="150" height="80" fill="white" stroke="black" />
    <text x="75" y="20" font-family="Arial" font-size="14" fill="black" text-anchor="middle" font-weight="bold">LEGEND</text>
    
    <rect x="20" y="35" width="20" height="20" fill="none" stroke="black" stroke-width="1" />
    <text x="50" y="50" font-family="Arial" font-size="12" fill="black">= 1 Tile (1x1)</text>
    <text x="20" y="70" font-family="Arial" font-size="10" fill="#666">(Approx. in perspective)</text>
  </g>

</svg>